[workspace]
members = [".", "typwire-macros"]
exclude = ["example", "test"]
resolver = "2"

[package]
name = "typwire"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Tim Voßhenrich"]
description = "Typed data exchange for Typst plugins."
readme = "README.md"
repository = "https://github.com/T1mVo/typwire"
license = "MIT OR Apache-2.0"
keywords = ["typst", "typing", "wasm", "plugin"]
categories = ["data-structures", "encoding", "wasm"]
exclude = ["example", "test", "scripts", "src-typst"]

[dependencies]
ciborium = "0.2.2"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
typwire-macros = { path = "typwire-macros", version = "0.2.0" }
wasm-minimal-protocol = "0.1.0"

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
trybuild = "1.0.114"
